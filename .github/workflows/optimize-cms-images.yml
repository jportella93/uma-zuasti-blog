name: Optimize CMS images

on:
  push:
    branches: [master]
    paths:
      - "static/img/**"

permissions:
  contents: write

# The CMS pushes commits in bursts, so several runs can overlap and race to
# push. Run them one at a time instead.
concurrency:
  group: optimize-cms-images
  cancel-in-progress: false

jobs:
  optimize:
    # Prevent infinite loops when this workflow pushes its own commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Optimize images in static/img
        run: npm run optimize:cms-images

      - name: Commit optimized images (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # master can move while the optimization runs (it takes a minute or
          # more), which makes the push non-fast-forward. On rejection, resync
          # onto the new master and optimize again before retrying.
          for attempt in 1 2 3; do
            if git diff --quiet -- static/img; then
              echo "No image changes to commit."
              exit 0
            fi

            git add static/img
            git commit -m "chore(images): optimize CMS uploads"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed optimized images (attempt ${attempt})."
              exit 0
            fi

            echo "Push rejected; resyncing with origin/${GITHUB_REF_NAME} and retrying."
            sleep 5
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            npm run optimize:cms-images
          done

          echo "Could not push optimized images after 3 attempts."
          exit 1
