name: Optimize CMS images

on:
  push:
    branches: [master]
    paths:
      - "static/img/**"

permissions:
  contents: write

# Serialize runs on master so two publishes in a row don't race each other.
concurrency:
  group: optimize-cms-images-master
  cancel-in-progress: false

jobs:
  optimize:
    # Prevent infinite loops when this workflow pushes its own commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Optimize images in static/img
        run: npm run optimize:cms-images

      - name: Commit optimized images (if changed)
        run: |
          if git diff --quiet; then
            echo "No image changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add static/img
          git commit -m "chore(images): optimize CMS uploads"

          # Netlify CMS usually lands a second commit (the post itself)
          # seconds after the image upload that triggered this run, while
          # this workflow takes minutes. By push time master has moved, so
          # a plain `git push` is rejected as non-fast-forward. Rebase the
          # optimization commit onto the latest master and retry.
          for attempt in 1 2 3; do
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "Rebase onto latest master failed (attempt $attempt)."
            elif git push origin HEAD:master; then
              echo "Pushed optimized images (attempt $attempt)."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done

          echo "Could not push optimized images after 3 attempts."
          exit 1
